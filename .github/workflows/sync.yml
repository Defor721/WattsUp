name: Sync to Forked Repository

on:
  push:
    branches:
      - develop  # 내 저장소의 develop 브랜치에 커밋이 발생하면 실행

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # GitHub 기본 인증 정보 사용 안 함

      - name: Add forked repository as remote
        run: |
          git remote add fork https://github.com/yoonstar1996/WattsUp.git
       
      - name: Push changes to forked repository
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git push https://${{ secrets.GH_PAT }}@github.com/yoonstar1996/WattsUp.git develop --force
        
          
